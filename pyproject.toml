[project]
name = "mia"
version = "0.1.0"
description = "Mia - Local AI Assistant for Windows"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "openai",
    "anthropic",
    "google-genai",
    "faster-whisper",
    "uiautomation",
    "pywinauto",
    "mss",
    "keyboard",
    "pystray",
    "pyyaml",
    "sounddevice",
    "numpy",
    "pillow",
    "python-dotenv",
    "piper-tts"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

[project.scripts]
mia = "mia.__main__:main"
