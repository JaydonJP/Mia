[project]
name = "mia"
version = "0.2.0"
description = "Mia - JARVIS-like AI Desktop Assistant for Windows"
requires-python = ">=3.11"
dependencies = [
    # LLM providers
    "ollama",
    "openai",
    "anthropic",
    "google-genai",

    # Voice
    "faster-whisper",
    "piper-tts",
    "sounddevice",
    "numpy",

    # UI Automation
    "uiautomation",
    "pywinauto",
    "keyboard",

    # Screen capture
    "mss",
    "pillow",

    # Terminal UI
    "rich",

    # Web search
    "ddgs",

    # System tray
    "pystray",

    # Config & environment
    "pyyaml",
    "python-dotenv",

    # Server (optional)
    "fastapi",
    "uvicorn",
    "websockets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mia"]

[project.scripts]
mia = "mia.__main__:main"
