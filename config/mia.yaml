llm:
  mode: local          # local | cloud | auto
  local:
    provider: ollama
    vision_model: qwen2.5vl:3b
    text_model: qwen2.5:3b
  cloud:
    provider: gemini   # openai | anthropic | gemini
    model: gemini-2.0-flash
    # api_key loaded from ~/.mia/secrets.env
  auto:
    cloud_threshold: complex   # route multi-step + vision-heavy to cloud

voice:
  push_to_talk_key: right ctrl
  wake_word: "hey mia"
  piper_voice: "en_GB-alan-medium"

web_search:
  provider: duckduckgo  # duckduckgo | google
  # For Google: set GOOGLE_SEARCH_API_KEY and GOOGLE_SEARCH_CX in ~/.mia/secrets.env

filesystem:
  allowed_dirs:
    - "~"              # User home directory (default)
    # Add more directories as needed:
    # - "C:\\Projects"
    # - "D:\\Documents"
